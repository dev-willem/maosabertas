name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    name: Validar especificação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python3 tools/validate_spec.py

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # maosabertas-py (pyo3) precisa de um interpretador para compilar.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  training:
    name: Python (treino)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install mediapipe opencv-python numpy pytest ruff ../crates/maosabertas-py
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  sem-dados-pessoais:
    name: Nenhum dado pessoal no commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recusar vídeo, landmarks e modelos
        run: |
          set -e
          encontrados=$(git ls-files | grep -Ei '\.(mp4|mov|avi|webm|npz|parquet|onnx|pt|pth|tflite|task)$' || true)
          if [ -n "$encontrados" ]; then
            echo "Arquivos proibidos no repositório (ver CONTRIBUTING.md):"
            echo "$encontrados"
            exit 1
          fi
          echo "ok"
