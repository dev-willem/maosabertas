[project]
name = "maosabertas-training"
version = "0.1.0"
description = "Treino e exportacao de modelos do projeto Maos Abertas"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy",
  "torch",
  "onnx",
  "onnxruntime",
  "mediapipe",
  "opencv-python",
  "polars",
  "scikit-learn",
  "jsonschema",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mlflow"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
