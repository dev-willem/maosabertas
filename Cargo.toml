[workspace]
resolver = "2"
members = ["crates/maosabertas-protocol", "crates/maosabertas-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/maosabertas/maosabertas"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
